name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Seed data is reproducible
        run: |
          node scripts/generate-data.js
          git diff --exit-code db/data
      - run: npm test
      - run: npx cds build --production
      - name: Docker image builds
        run: docker build -t quality-copilot:ci .
